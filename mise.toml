[tools]
uv = 'latest'

[env]
_.python.venv = { path = ".venv", create = true }

[tasks.venv]
description = "Set a virtual environment for the project"
# _.python.venv = { path = ".venv", create = true }
run = [
    'uv sync --group dev'
]

[tasks.py-fund-manager]
description = "Run py-fund-manager"
depends = ["venv"]
run = [
    'uv run python -m py_fund_manager'
]

[tasks.build]
description = "Build source and wheel distributions"
run = [
    'uv build'
]

[tasks.clean]
description = "Do local clean-up"
run = [
    'rm -rf .mypy_cache .ruff_cache .venv dist py_fund_manager.egg-info',
    'find . -name __pycache__ | xargs rm -rf'
]

[tasks.format]
description = "Format python sources"
run = [
    # sort imports
    'uv run ruff check --select I --fix py_fund_manager tests',
    # reformat sources
    'uv run ruff format -v py_fund_manager tests',
]

[tasks.lint]
description = "Lint python sources"
run = [
    # check imports
    'uv run ruff check -v --select I py_fund_manager/*.py tests/*.py',
    'uv run ruff check -v py_fund_manager/*.py tests/*.py'
]

[tasks.mypy]
description = "Check typing"
run = [
    'uv run mypy py_fund_manager tests'
]

[tasks.tests]
description = "Execute unit tests"
run = [
    'uv run -m unittest -v tests/*_test.py',
]
