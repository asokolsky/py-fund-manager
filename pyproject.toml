[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "py-fund-manager"
version = "0.2.1"
description = "Just playing with financial CLIs."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "defusedxml",
    "Jinja2",
    "pandas",
    "pyarrow",
    "pydantic>=2.12,<3",
    "PyYAML",
    "scipy",
    "textual",
    "tabulate",
    "yfinance",
]

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["py_fund_manager", "py_fund_manager.broker"]

[dependency-groups]
# uv sync --group dev
dev = [
    "types-defusedxml",
    "types-tabulate",
    "textual-dev",
    "mypy>=1.16.1",
    "ruff>=0.12.1",
    "types-pyyaml>=6.0.12.20250516",
    "typing-inspect>=0.9.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "A001","A002","ANN401","ARG001",
    "B006","B011","BLE001",
    "C901","COM812","CPY001",
    "D100","D101","D102","D103","D104","D107","D200","D202","D203","D205","D212","D400","D401","D415",
    "E501","EM102","ERA001",
    "FBT001",
    "G004",
    "Q000","Q003",
    "N801","N803","N806",
    "PT009","PT015","PT027","PLR0915","PLR1711","PLR0912","PLR0913","PLR2004","PLW0603",
    "RET505","RET507","RUF022",
    "S101","S603","SIM114","SLF001",
    "T201",
    "TRY003","TRY300"
]

[tool.ruff.lint.per-file-ignores]
"sample-data/strategy/SnP500-direct/generate_strategy.py" = ["INP001"]

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "textual.*",
    "yfinance.*",
    "strip_ansi.*",
    "pandas.*",
    "pyarrow.*"
]
ignore_missing_imports = true
